<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<!-- Fuente de la imagen para compartir (assets/og-masterclass.png). Se renderiza con Chrome a 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Poppins, sans-serif; color: #fff; background: linear-gradient(150deg, #1b6ef3, #8b3dff 58%, #d4127a); position: relative; padding: 64px 72px; }
  .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.10); }
  .b1 { width: 520px; height: 520px; right: -140px; top: -170px; }
  .b2 { width: 300px; height: 300px; right: 120px; bottom: -190px; background: rgba(255,255,255,.08); }
  .top { display: flex; align-items: center; justify-content: space-between; position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; letter-spacing: .5px; }
  .brand img { width: 60px; height: 60px; background: #fff; border-radius: 16px; padding: 6px; }
  .chip { background: #fff; color: #d4127a; font-weight: 800; font-size: 24px; padding: 12px 26px; border-radius: 999px; }
  h1 { position: relative; margin-top: 54px; font-size: 76px; line-height: 1.04; font-weight: 800; letter-spacing: -2px; max-width: 900px; }
  .when { position: relative; margin-top: 40px; display: flex; gap: 16px; }
  .pill { background: rgba(255,255,255,.18); border-radius: 20px; padding: 16px 26px; font-size: 28px; font-weight: 700; }
  .cta { position: absolute; right: 72px; bottom: 64px; background: #0e1430; color: #fff; font-size: 28px; font-weight: 700; padding: 18px 34px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="top">
    <div class="brand"><img src="../assets/logo-nova.png" alt="">NOVA</div>
    <div class="chip">100% GRATUITA</div>
  </div>
  <h1>Master class: aprende y aplica IA a tu negocio</h1>
  <div class="when">
    <div class="pill">Viernes 20 de noviembre</div>
    <div class="pill">7:00 p. m. (Colombia)</div>
  </div>
  <div class="cta">Inscríbete gratis →</div>
</body>
</html>
